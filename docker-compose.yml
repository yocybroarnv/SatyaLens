version: '3.8'

services:
  streamlit:
    build: .
    container_name: satyalens-streamlit-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PORT=8501
    restart: always

  api:
    build: .
    container_name: satyalens-fastapi-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: always
